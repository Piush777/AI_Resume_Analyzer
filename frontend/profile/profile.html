
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | Career Assistant</title>

    <link rel="stylesheet" href="../global/global.css">
    <link rel="stylesheet" href="./profile.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="../global/global.js" defer></script>
    <script src="./profile.js" defer></script>
</head>

<body>

    <div id="container">

        <!-- Shared Topbar -->
        <header id="topbar">

            <button id="menu-btn" type="button" aria-label="Toggle sidebar">
                <i class="fa-solid fa-bars"></i>
            </button>

            <a href="../index.html" id="brand">
                <span id="brand-icon">
                    <i class="fa-regular fa-file-lines"></i>
                </span>

                <span>Career Assistant</span>
            </a>

            <div id="auth-actions">
                <a href="../login/login.html" id="login-link">Login</a>
                <a href="../login/login.html" id="signup-btn">Sign up</a>
            </div>

        </header>


        <!-- Shared Sidebar -->
        <aside id="sidebar-column">

            <nav id="sidebar" aria-label="Main navigation">

                <a href="../index.html" class="nav-link">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </a>

                <a href="../resumeAnalyzer/resumeAnalyzer.html" class="nav-link">
                    <i class="fa-regular fa-file-lines"></i>
                    <span>Resume Analyzer</span>
                </a>

                <a href="../jobMatching/jobmatching.html" class="nav-link">
                    <i class="fa-solid fa-briefcase"></i>
                    <span>Job Matching</span>
                </a>

                <a href="../history/history.html" class="nav-link">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>Resume History</span>
                </a>

                <a href="../profile/profile.html" class="nav-link active">
                    <i class="fa-solid fa-user"></i>
                    <span>Profile</span>
                </a>

            </nav>

        </aside>


        <!-- Shared Overlay -->
        <div id="overlay"></div>


        <!-- Profile Content -->
        <div id="app-layout">

            <main>

                <header class="profile-header">
                    <h1>Profile</h1>

                    <p>Manage your account information</p>
                </header>


                <!-- Profile Photo -->
                <div class="profile-image">

                    <i class="fa-solid fa-circle-user" id="default-icon"></i>

                    <img id="profile-preview" alt="Profile Image">

                    <input
                        type="file"
                        id="profile-upload"
                        accept="image/*"
                        hidden
                    >

                    <button type="button" class="photo-btn">
                        Change Photo
                    </button>

                </div>


                <!-- Profile Form -->
                <section class="profile-card">

                    <form class="profile-form">

                        <div class="profile-fields">

                            <div class="field">
                                <label for="name">Name</label>

                                <input
                                    type="text"
                                    id="name"
                                    class="profile-input"
                                    placeholder="Enter your name"
                                >
                            </div>


                            <div class="field">
                                <label for="email">Email</label>

                                <input
                                    type="email"
                                    id="email"
                                    class="profile-input"
                                    placeholder="Enter your email"
                                >
                            </div>


                            <div class="field">
                                <label for="phone">Phone</label>

                                <input
                                    type="text"
                                    id="phone"
                                    class="profile-input"
                                    placeholder="Enter your phone number"
                                >
                            </div>


                            <div class="field">
                                <label for="location">Location</label>

                                <input
                                    type="text"
                                    id="location"
                                    class="profile-input"
                                    placeholder="Enter your location"
                                >
                            </div>


                            <div class="field">
                                <label for="linkedin">LinkedIn</label>

                                <input
                                    type="text"
                                    id="linkedin"
                                    class="profile-input"
                                    placeholder="Enter LinkedIn profile link"
                                >
                            </div>


                            <div class="field">
                                <label for="github">GitHub</label>

                                <input
                                    type="text"
                                    id="github"
                                    class="profile-input"
                                    placeholder="Enter GitHub profile link"
                                >
                            </div>

                        </div>


                        <div class="profile-actions">

                            <button type="submit" class="save-btn">
                                Save Profile
                            </button>

                        </div>

                    </form>

                </section>

            </main>

        </div>

    </div>

</body>

</html>
