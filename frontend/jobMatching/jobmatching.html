<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Job Matching | Career Assistant</title>

  <!-- Shared CSS -->
  <link rel="stylesheet" href="../global/global.css">

  <!-- Job Matching CSS -->
  <link rel="stylesheet" href="./jobmatching.css">

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <!-- Shared JavaScript -->
  <script src="../global/global.js" defer></script>

  <!-- Job Matching JavaScript -->
  <script src="./jobmatching.js" defer></script>
</head>

<body>

  <div id="container">

    <!-- =========================================
         TOPBAR
         ========================================= -->

    <header id="topbar">

      <!-- Hamburger button -->
      <button
        id="menu-btn"
        type="button"
        aria-label="Toggle sidebar"
        aria-controls="sidebar"
        aria-expanded="false"
      >
        <i class="fa-solid fa-bars"></i>
      </button>

      <!-- Brand -->
      <a href="../index.html" id="brand">

        <span id="brand-icon">
          <i class="fa-regular fa-file-lines"></i>
        </span>

        <span>Career Assistant</span>

      </a>

      <!-- Authentication actions -->
      <div id="auth-actions">

        <a href="../login/login.html" id="login-link">
          Login
        </a>

        <a href="../signup/signup.html" id="signup-btn">
          Sign up
        </a>

      </div>

    </header>


    <!-- =========================================
         SIDEBAR
         ========================================= -->

    <aside id="sidebar-column">

      <nav id="sidebar" aria-label="Main navigation">

        <!-- Dashboard -->
        <a
          href="../index.html"
          class="nav-link"
          title="Dashboard"
        >
          <i class="fa-solid fa-house"></i>
          <span>Dashboard</span>
        </a>

        <!-- Resume Analyzer -->
        <a
          href="../resumeAnalyzer/resumeAnalyzer.html"
          class="nav-link"
          title="Resume Analyzer"
        >
          <i class="fa-solid fa-file-lines"></i>
          <span>Resume Analyzer</span>
        </a>

        <!-- Job Matching -->
        <a
          href="./jobmatching.html"
          class="nav-link active"
          title="Job Matching"
          aria-current="page"
        >
          <i class="fa-solid fa-briefcase"></i>
          <span>Job Matching</span>
        </a>

        <!-- Resume History -->
        <a
          href="../history/history.html"
          class="nav-link"
          title="Resume History"
        >
          <i class="fa-solid fa-clock-rotate-left"></i>
          <span>Resume History</span>
        </a>

        <!-- Profile -->
        <a
          href="../profile/profile.html"
          class="nav-link"
          title="Profile"
        >
          <i class="fa-solid fa-user"></i>
          <span>Profile</span>
        </a>

      </nav>

    </aside>


    <!-- =========================================
         SIDEBAR OVERLAY
         ========================================= -->

    <div id="overlay"></div>


    <!-- =========================================
         MAIN APPLICATION LAYOUT
         ========================================= -->

    <div id="app-layout">

      <main>

        <!-- Page heading -->
        <header class="jobmatching-header">

          <h1>Job Matching</h1>

          <p>
            Find jobs that match your resume and skills.
          </p>

        </header>


        <!-- Recommended jobs section -->
        <section id="recommended-jobs">

          <h2>Recommended Jobs</h2>

          <div id="job-container">

            <!-- Empty state -->
            <div class="jobs-empty">

              <div class="jobs-empty-icon">
                <i class="fa-solid fa-briefcase"></i>
              </div>

              <h3>No job matches yet</h3>

              <p>
                Analyze your resume to discover jobs that match your skills.
              </p>

              <a
                href="../resumeAnalyzer/resumeAnalyzer.html"
                class="jobs-empty-btn"
              >
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>Analyze Resume</span>
              </a>

            </div>

          </div>

        </section>

      </main>

    </div>

  </div>

</body>

</html>
