<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Matching</title>

  <link rel="stylesheet" href="../global/global.css">
  <link rel="stylesheet" href="./jobmatching.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <script src="../global/global.js" defer></script>
  <script src="./jobmatching.js" defer></script>

</head>

<body>

  <div id="container">

    <nav id="sidebar">

      <div id="sidebar-top">
        <h2 id="logo">
          AI Resume Analyzer
        </h2>

        <div id="close-btn">
          ✕
        </div>
      </div>

      <a href="../index.html" class="nav-link">Dashboard</a>

      <a href="../resumeAnalyzer/resumeAnalyzer.html" class="nav-link">Resume Analyzer</a>

      <a href="../jobMatching/jobmatching.html" class="nav-link">Job Matching</a>

      <a href="../history/history.html" class="nav-link">Resume History</a>

      <a href="../profile/profile.html" class="nav-link">Profile</a>

      <a href="../login/login.html" class="nav-link">Login</a>

    </nav>
    <div id="overlay"></div>

    <main>
      <div id="topbar">

        <div id="menu-btn">
          ☰
        </div>

        <div id="profile">

          <div id="profile-btn">

            <i class="fa-solid fa-circle-user"></i>

            <p>Profile</p>

            <i class="fa-solid fa-chevron-down"></i>

          </div>

          <div id="profile-dropdown">

            <a href="../profile/profile.html">

              Profile

            </a>

            <a href="../login/login.html">

              Logout

            </a>

          </div>

        </div>
      </div>

      <header class="jobmatching-header">

        <h1>Job Matching</h1>

        <p>
          Find jobs that match your resume and skills.
        </p>

      </header>
      <section id="recommended-jobs">

        <h2>Recommended Jobs</h2>

        <div id="job-container">

          <div class="jobs-empty">

            <div class="jobs-empty-icon">
              <i class="fa-solid fa-briefcase"></i>
            </div>

            <h3>No job matches yet</h3>

            <p>
              Analyze your resume to discover jobs that match your skills.
            </p>

            <a href="../resumeAnalyzer/resumeAnalyzer.html" class="jobs-empty-btn">
              <i class="fa-solid fa-wand-magic-sparkles"></i>
              <span>Analyze Resume</span>
            </a>
          </div>

        </div>

      </section>
    </main>

  </div>

</body>

</html>
